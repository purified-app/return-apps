name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          [
            shared-ui,
            sign-back,
            scan-back,
            geo-back,
            map-pick-back,
            pin-back,
            nfc-back,
            color-back,
            orient-back,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - if: matrix.app == 'shared-ui'
        run: bun run build:shared-ui
      - if: matrix.app != 'shared-ui'
        run: bun run build:${{ matrix.app }}
      - run: bun run test:${{ matrix.app }}
