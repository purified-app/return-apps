name: Deploy pin-back

on:
  push:
    branches: [main]
    paths:
      - 'projects/pin-back/**'
      - 'projects/shared-ui/**'
      - 'package.json'
      - 'bun.lock'
      - 'angular.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy-pin-back.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pin-back
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build:pin-back
      - name: Deploy to pin-back Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
          external_repository: purified-app/pin-back
          publish_dir: dist/pin-back/browser
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy pin-back from return-apps'
