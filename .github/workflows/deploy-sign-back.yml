name: Deploy sign-back

on:
  push:
    branches: [main]
    paths:
      - 'projects/sign-back/**'
      - 'projects/shared-ui/**'
      - 'package.json'
      - 'bun.lock'
      - 'angular.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy-sign-back.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sign-back
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build:sign-back
      # Publishes the production build to purified-app/sign-back (gh-pages) so
      # https://sign-back.purified.app keeps working after the monorepo move.
      # Requires repo secret DEPLOY_GITHUB_TOKEN with contents:write on sign-back.
      - name: Deploy to sign-back Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
          external_repository: purified-app/sign-back
          publish_dir: dist/sign-back/browser
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy sign-back from return-apps'
