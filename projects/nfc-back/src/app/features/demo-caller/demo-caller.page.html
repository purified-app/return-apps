<main class="demo">
  <header>
    <p class="brand">Demo caller</p>
    <h1>Simulate another app that opens NfcBack</h1>
    <p class="lead">Tap “Scan NFC” to open the reader. After a successful read, the value returns here.</p>
  </header>

  <button type="button" class="btn" (click)="startNfc()">Scan NFC</button>

  <rb-meta-list
    [value]="value()"
    [format]="lastFormat()"
    [state]="lastState()"
    [error]="lastError()"
  />
</main>
