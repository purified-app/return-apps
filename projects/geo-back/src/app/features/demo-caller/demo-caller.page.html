<main class="demo">
  <header>
    <p class="brand">Demo caller</p>
    <h1>Simulate another app that opens GeoBack</h1>
    <p class="lead">Tap “Get location” to open GeoBack. After success, coordinates return here.</p>
  </header>

  <button type="button" class="btn" (click)="startGeo()">Get location</button>

  @if (lat() || lng()) {
    <dl class="meta">
      @if (lat()) {
        <div>
          <dt>Latitude</dt>
          <dd>{{ lat() }}</dd>
        </div>
      }
      @if (lng()) {
        <div>
          <dt>Longitude</dt>
          <dd>{{ lng() }}</dd>
        </div>
      }
      @if (accuracy()) {
        <div>
          <dt>Accuracy</dt>
          <dd>{{ accuracy() }} m</dd>
        </div>
      }
    </dl>
  }

  <rb-meta-list [format]="lastFormat()" [state]="lastState()" [error]="lastError()" />
</main>
