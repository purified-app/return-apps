<main class="demo">
  <header>
    <p class="brand">Demo caller</p>
    <h1>Simulate another app that opens ColorBack</h1>
    <p class="lead">Tap “Pick color” to open the eyedropper. After Use color, the value returns here.</p>
  </header>

  <button type="button" class="btn" (click)="startColor()">Pick color</button>

  @if (value(); as hex) {
    <div class="swatch-row">
      <span class="swatch" [style.background]="hex" aria-hidden="true"></span>
      @if (rgb(); as rgbValue) {
        <p class="lead">RGB {{ rgbValue }}</p>
      }
    </div>
  }

  <rb-meta-list
    [value]="value()"
    [format]="lastFormat()"
    [state]="lastState()"
    [error]="lastError()"
  />
</main>
