<main class="demo">
  <header>
    <p class="brand">Demo caller</p>
    <h1>Simulate another app that opens ScanBack</h1>
    <p class="lead">
      Tap “Scan” to open the scanner. After a hit, the field is filled with the scanned value.
    </p>
  </header>

  <label class="field">
    <span>Value</span>
    <input
      type="text"
      [ngModel]="scannedValue()"
      (ngModelChange)="scannedValue.set($event)"
      placeholder="Empty until you scan"
    />
  </label>

  <button type="button" class="btn" (click)="startScan()">Scan</button>

  <rb-meta-list [format]="lastFormat()" [state]="lastState()" [error]="lastError()" />
</main>
